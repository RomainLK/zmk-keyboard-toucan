manifest:
  defaults:
    revision: v0.3
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: petejohanson
      url-base: https://github.com/petejohanson/
    - name: caksoylar
      url-base: https://github.com/caksoylar
    - name: geeksville
      url-base: https://github.com/geeksville
    - name: RomainLK
      url-base: https://github.com/RomainLK
    - name: dhruvinsh
      url-base: https://github.com/dhruvinsh
  projects:
    - name: zmk
      remote: zmkfirmware
      import: app/west.yml
    # Fork of geeksville/cirque-input-module @ toucan with two fixes for the
    # right half losing all input after sustained trackpad use (verified on HW):
    #  1. Cap the Pinnacle sample rate at 60 sps (was 100) and make input_report_*
    #     non-blocking, so a fast finger can't flood the ZMK split BLE notification
    #     path and deadlock the peripheral TX pipeline (sysworkq + input thread +
    #     BT TX) — the actual root cause of the wedge.
    #  2. Always re-enable the data-ready interrupt in the work handler (a latent
    #     bug: an early-return read path could leave the level-triggered DR int
    #     masked forever).
    # Pinned to an immutable commit. Fork branch: toucan-fix-dr-reenable.
    # Rebase onto geeksville/toucan to pull upstream changes.
    - name: cirque-input-module
      remote: RomainLK
      revision: 992e2a8d4673f440c0b98546d9891b9a2027afa7
    - name: zmk-rgbled-widget
      remote: caksoylar
      revision: v0.3
    # Provides the zmk,behavior-tri-state driver used by Miryoku's alt-tab/cmd-tab
    # swappers (win_swapper/swapper). Mainline ZMK never merged tri-state; the Zen
    # fork has it built in. Module targets Zephyr 3.5, matching ZMK v0.3. The driver
    # auto-enables from the DT node (no Kconfig needed). Pinned to an immutable commit.
    - name: zmk-tri-state
      remote: dhruvinsh
      revision: ebbc1f0ccdb51669650bb0ac3e34920d09e62400
  self:
    path: config
